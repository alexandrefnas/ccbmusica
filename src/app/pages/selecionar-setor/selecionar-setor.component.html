
<div class="selecao-container">
  <div class="selecao-painel">
    <header class="selecao-cabecalho">
      <div class="selecao-icone">
        <i class="bi bi-diagram-3"></i>
      </div>

      <div>
        <h2>Selecionar setor</h2>
        <p>Escolha o setor que deseja acessar.</p>
      </div>
    </header>

    <div class="selecao-conteudo">
      <p class="selecao-orientacao">
        Os dados do sistema serão apresentados conforme
        o setor selecionado e suas permissões de acesso.
      </p>

      <div *ngIf="carregando" class="selecao-mensagem">
        Carregando setores...
      </div>

      <div
        *ngIf="!carregando && erro"
        class="selecao-erro"
        role="alert"
      >
        {{ erro }}
      </div>

      <div
        *ngIf="!carregando && !erro && !setores.length"
        class="selecao-mensagem"
      >
        Nenhum setor disponível.
      </div>

      <div class="setores-grid" *ngIf="!carregando">
        <button
          *ngFor="let setor of setores"
          type="button"
          class="setor-card"
          (click)="selecionarSetor(setor.id!)"
        >
          <div class="setor-card-icone">
            <i class="bi bi-building"></i>
          </div>

          <div class="setor-card-info">
            <strong>{{ setor.nomeSetor }}</strong>
            <span>
              {{ setor.nomeCidade }} - {{ setor.estado }}
            </span>
          </div>

          <i class="bi bi-chevron-right setor-seta"></i>
        </button>
      </div>
    </div>
  </div>
</div>
