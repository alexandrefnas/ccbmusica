<div class="container__button">
  <button
    class="buttons"
    [type]="type"
    [title]="descricao"
    (click)="onClick($event)"
    [disabled]="disabled"
  >
    @if (icon) {
      <i [class]="icon"></i>
    }
    @if (liberarLabel) {
      <span>{{ label }}</span>
    }
  </button>
</div>
