<div
  class="form-field"
  [class.focused]="isFocused || selectedValue || placeholder"
>
  <label class="form-label">{{ label }}</label>

  <div class="input-wrapper" cdkOverlayOrigin #selectOrigin="cdkOverlayOrigin">
    <div
      class="form-input custom-select"
      (click)="toggleDropdown($event)"
      [class.disabled]="disabled"
      tabindex="0"
      (focus)="isFocused = true"
      (blur)="onBlur()"
      (keydown)="onKeyDownCustom($event); buscarPorTecla($event)"
      [class.open]="open"
    >
      {{ getSelectedLabel() }}
    </div>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="selectOrigin"
      [cdkConnectedOverlayOpen]="open"
      [cdkConnectedOverlayPositions]="posicoesDropdown"
      [cdkConnectedOverlayWidth]="dropdownWidth"
      [cdkConnectedOverlayPush]="true"
    >
      <div class="dropdown" (click)="$event.stopPropagation()">
        <div class="busca-container" *ngIf="niveisLimitados.length > 10">
          <input
            class="input-busca"
            type="text"
            placeholder="Pesquisar..."
            [(ngModel)]="textoFiltro"
            (keydown)="$event.stopPropagation()"
            autofocus
          />

          <i class="bi bi-search"></i>
        </div>

        <div class="lista-opcoes">
          <div
            class="option"
            *ngFor="let nivel of opcoesFiltradas; let i = index"
            [attr.data-index]="i"
            [class.destacado]="i === indiceDestacado"
            (click)="selectOption(nivel)"
          >
            {{ nivel.label }}
          </div>

          <div class="option vazio" *ngIf="opcoesFiltradas.length === 0">
            Nenhum resultado encontrado
          </div>
        </div>
      </div>
    </ng-template>
  </div>

  <div class="form-error" *ngIf="hasError() && !isFocused">
    {{ errorMessage }}
  </div>
</div>
